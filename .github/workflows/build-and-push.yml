name: Build and Push Docker Image

on:
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        run: |
          cd backend
          go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Build frontend
        run: |
          cd web
          npm run build

  build-image:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Get branch and SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_BRANCH=main" >> $GITHUB_ENV
          else
            echo "APP_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Determine image tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_HASH=${{ env.SHORT_SHA }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/harborwatch:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/harborwatch:${{ github.sha }}

      - name: Tag image latest
        if: env.PUBLISH_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/harborwatch:latest \
            ghcr.io/${{ env.OWNER_LC }}/harborwatch:${{ env.IMAGE_TAG }}
