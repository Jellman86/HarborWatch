openapi: 3.0.3
info:
  title: HarborWatch API
  version: 0.5.0
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/docker/containers:
    get:
      operationId: listDockerContainers
      responses:
        '200':
          description: Container inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerSummary'
  /api/docker/{id}:
    get:
      operationId: getDockerContainerDetail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detailed container information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDetail'
  /api/docker/{id}/logs:
    get:
      operationId: getDockerContainerLogs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: tail
          required: false
          schema: { type: integer, default: 300 }
        - in: query
          name: since
          required: false
          schema:
            type: string
            description: Duration (`15m`, `1h`) or unix timestamp (seconds)
        - in: query
          name: timestamps
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Recent container logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLogs'
  /api/docker/{id}/rules:
    get:
      operationId: getContainerRules
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Container specific rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerRules'
    post:
      operationId: saveContainerRules
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerRules'
      responses:
        '200':
          description: Rules saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /api/docker/images:
    get:
      operationId: listDockerImages
      responses:
        '200':
          description: Image inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageSummary'
  /api/docker/prune:
    post:
      operationId: triggerDockerPrune
      responses:
        '202':
          description: Prune task triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  task: { type: string }
  /api/docker/events:
    get:
      operationId: streamDockerEvents
      responses:
        '200':
          description: Docker events stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/scans/run:
    post:
      operationId: runScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRunRequest'
      responses:
        '202':
          description: Scan started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStartResponse'
  /api/scans/jobs/{id}:
    get:
      operationId: getScanJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scan job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobStatus'
  /api/scans/summary:
    get:
      operationId: getScanSummary
      responses:
        '200':
          description: Scan summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanSummary'
  /api/releases/summary:
    get:
      operationId: getReleaseRiskSummary
      parameters:
        - in: query
          name: repo
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Release risk summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRiskSummary'
  /api/updates/run:
    post:
      operationId: runUpdatePipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStartRequest'
      responses:
        '202':
          description: Update pipeline started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStartResponse'
  /api/updates/jobs/{id}:
    get:
      operationId: getUpdateJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Update job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateJobStatus'
  /api/updates/events/{id}:
    get:
      operationId: streamUpdateEvents
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Update step events stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/scans/malware/run:
    post:
      operationId: runMalwareScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MalwareScanRequest'
      responses:
        '202':
          description: Malware scan started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStartResponse'
  /api/scans/malware/summary:
    get:
      operationId: getMalwareScanSummary
      parameters:
        - in: query
          name: target
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Malware scan summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MalwareScanSummary'
  /api/scans/malware/details:
    get:
      operationId: getMalwareScanDetails
      parameters:
        - in: query
          name: target
          required: false
          schema: { type: string }
        - in: query
          name: prefix
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Malware scan details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MalwareScanDetail'
  /api/scans/malware/signatures/status:
    get:
      operationId: getClamAVSignatureStatus
      responses:
        '200':
          description: ClamAV engine and signature metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClamAVSignatureStatus'
  /api/scans/malware/signatures/update:
    post:
      operationId: updateClamAVSignatures
      responses:
        '200':
          description: Triggered and completed signature update
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  summary: { type: string }
  /api/scans/malware/container/{id}:
    post:
      operationId: runContainerMalwareScan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Container malware scans queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  containerId: { type: string }
  /api/audit/jobs:
    get:
      operationId: listAuditJobs
      responses:
        '200':
          description: Historical job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditJobSummary'
  /api/ai/status:
    get:
      operationId: getAIStatus
      responses:
        '200':
          description: AI provider status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
  /api/ai/models:
    get:
      operationId: getAIModels
      parameters:
        - in: query
          name: provider
          required: false
          schema: { type: string, enum: [openai, anthropic, gemini] }
      responses:
        '200':
          description: Provider model catalog
          content:
            application/json:
              schema:
                type: object
  /api/ai/test:
    post:
      operationId: testAIProviderModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [openai, anthropic, gemini] }
                model: { type: string }
              required: [provider]
      responses:
        '200':
          description: AI test result
          content:
            application/json:
              schema:
                type: object
  /api/ai/fleet-advice:
    get:
      operationId: getLatestFleetAdvice
      responses:
        '200':
          description: Latest persisted fleet advice
          content:
            application/json:
              schema:
                type: object
                properties:
                  advice: { type: string }
                  timestamp: { type: integer, format: int64 }
    post:
      operationId: getFleetAdvice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContainerSummary'
      responses:
        '200':
          description: Fleet-level operational advice
          content:
            application/json:
              schema:
                type: object
                properties:
                  advice: { type: string }
  /api/ai/audit-compose:
    post:
      operationId: auditComposeFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml: { type: string }
      responses:
        '200':
          description: AI analysis of the compose file
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: string }
  /api/ai/audit-compose/{id}:
    get:
      operationId: auditContainerCompose
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: AI analysis of the container's compose
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: string }
                  config: { type: string }
  /api/ai/analyze-metrics:
    post:
      operationId: analyzeContainerMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                containerId: { type: string }
                metrics:
                  type: array
                  items:
                    $ref: '#/components/schemas/Metric'
      responses:
        '200':
          description: AI performance analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: string }
  /api/settings:
    get:
      operationId: getSettings
      responses:
        '200':
          description: Application settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    post:
      operationId: saveSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /api/metrics/{id}:
    get:
      operationId: getContainerMetrics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: duration
          required: false
          schema: { type: string, default: "24h" }
      responses:
        '200':
          description: Historical metrics for the container
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metric'
  /api/metrics/batch:
    post:
      operationId: getBatchContainerMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                duration:
                  type: string
              required: [ids]
      responses:
        '200':
          description: Metrics by container id
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Metric'
  /api/portainer/stacks:
    get:
      operationId: listPortainerStacks
      responses:
        '200':
          description: Portainer stacks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/system/status:
    get:
      operationId: getSystemStatus
      responses:
        '200':
          description: Runtime diagnostics summary
          content:
            application/json:
              schema:
                type: object
  /api/system/logs:
    get:
      operationId: getSystemLogs
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 100 }
        - in: query
          name: level
          required: false
          schema: { type: string }
        - in: query
          name: source
          required: false
          schema: { type: string }
        - in: query
          name: since
          required: false
          schema:
            type: integer
            format: int64
            description: Unix timestamp (seconds)
      responses:
        '200':
          description: Internal logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiagLogEntry'
  /api/diagnostics/containers/{id}/logs:
    get:
      operationId: getDiagnosticsContainerLogs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: tail
          required: false
          schema: { type: integer, default: 300 }
        - in: query
          name: since
          required: false
          schema:
            type: string
            description: Duration (`15m`, `1h`) or unix timestamp (seconds)
        - in: query
          name: timestamps
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Diagnostics container log payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLogs'
  /api/diagnostics/snapshot:
    get:
      operationId: getDiagnosticsSnapshot
      parameters:
        - in: query
          name: logLimit
          required: false
          schema: { type: integer, default: 300 }
        - in: query
          name: auditLimit
          required: false
          schema: { type: integer, default: 100 }
        - in: query
          name: includeFleet
          required: false
          schema: { type: boolean, default: true }
        - in: query
          name: containerId
          required: false
          schema: { type: string }
        - in: query
          name: containerLogTail
          required: false
          schema: { type: integer, default: 250 }
        - in: query
          name: containerLogSince
          required: false
          schema:
            type: string
            description: Duration (`15m`, `1h`) or unix timestamp (seconds)
      responses:
        '200':
          description: Aggregated diagnostics bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSnapshot'
components:
  schemas:
    ContainerDetail:
      type: object
      required: [summary]
      properties:
        summary: { $ref: '#/components/schemas/ContainerSummary' }
        diskUsage: { $ref: '#/components/schemas/ContainerDiskUsage' }
        vulnerabilitySummary: { $ref: '#/components/schemas/ScanSummary' }
        malwareSummary:
          type: array
          items: { $ref: '#/components/schemas/MalwareScanSummary' }
        recentMetrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
        actionHistory:
          type: array
          items: { $ref: '#/components/schemas/AuditJobSummary' }
        rules: { $ref: '#/components/schemas/ContainerRules' }
    ContainerDiskUsage:
      type: object
      properties:
        writableBytes: { type: integer, format: int64 }
        rootFsBytes: { type: integer, format: int64 }
        mountCount: { type: integer }
        hostTotalBytes: { type: integer, format: int64 }
        hostAvailableBytes: { type: integer, format: int64 }
        hostUsedBytes: { type: integer, format: int64 }
    ContainerRules:
      type: object
      required: [containerId, updatePolicy]
      properties:
        containerId: { type: string }
        updatePolicy: { type: string, enum: [auto, manual, locked] }
        validateUrl: { type: string }
        validateMode: { type: string, enum: [http, docker, both] }
        validateTimeoutSec: { type: integer }
        validateIntervalSec: { type: integer }
        bypassAi: { type: boolean }
        skipHealthCheck: { type: boolean }
        aiValidateLogs: { type: boolean }
        autoRollback: { type: boolean }
        inheritAutomation: { type: boolean }
        upgradesAutomation: { type: boolean }
        maintenanceAutomation: { type: boolean }
        securityAutomation: { type: boolean }
        restartOnUnhealthy: { type: boolean }
        unhealthyRestartCooldownSec: { type: integer, minimum: 0 }
    Metric:
      type: object
      required: [containerId, timestamp, cpuPercent, memoryUsage, memoryLimit, pids]
      properties:
        containerId: { type: string }
        timestamp: { type: integer, format: int64 }
        cpuPercent: { type: number, format: double }
        memoryUsage: { type: integer, format: int64 }
        memoryLimit: { type: integer, format: int64 }
        pids: { type: integer }
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
    AuditJobSummary:
      type: object
      required: [id, type, target, status, startedAt]
      properties:
        id: { type: string }
        type: { type: string }
        target: { type: string }
        containerId: { type: string }
        status: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string }
        startedAt: { type: integer, format: int64 }
        completedAt: { type: integer, format: int64 }
    ContainerSummary:
      type: object
      required: [id, names, image, state, status]
      properties:
        id: { type: string }
        names: { type: array, items: { type: string } }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        health: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        updateAvailable: { type: boolean }
    ImageSummary:
      type: object
      required: [id, repoTags, size]
      properties:
        id: { type: string }
        repoTags: { type: array, items: { type: string } }
        size: { type: integer, format: int64 }
    DockerEvent:
      type: object
      required: [type, action, id, from, time]
      properties:
        type: { type: string }
        action: { type: string }
        id: { type: string }
        from: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
        time: { type: integer, format: int64 }
    DiagLogEntry:
      type: object
      required: [timestamp, level, source, message]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: integer, format: int64 }
        level: { type: string }
        source: { type: string }
        message: { type: string }
    ContainerLogs:
      type: object
      required: [containerId, tail, since, timestamps, combined, lineCount, truncated, capturedAt]
      properties:
        containerId: { type: string }
        tail: { type: integer }
        since: { type: integer, format: int64 }
        timestamps: { type: boolean }
        stdout: { type: string }
        stderr: { type: string }
        combined: { type: string }
        lineCount: { type: integer }
        truncated: { type: boolean }
        capturedAt: { type: integer, format: int64 }
    JobProgress:
      type: object
      required: [id, type, target, status, progress, startedAt]
      properties:
        id: { type: string }
        type: { type: string }
        target: { type: string }
        status: { type: string }
        message: { type: string }
        progressMode:
          type: string
          enum: [measured, estimated]
        progress: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: integer, format: int64 }
    DiagnosticsSnapshot:
      type: object
      required: [generatedAt, components]
      properties:
        generatedAt: { type: integer, format: int64 }
        components:
          type: object
          additionalProperties: { type: string }
        errors:
          type: array
          items: { type: string }
        systemStatus:
          type: object
        internalLogs:
          type: array
          items: { $ref: '#/components/schemas/DiagLogEntry' }
        activeJobs:
          type: array
          items: { $ref: '#/components/schemas/JobProgress' }
        recentAuditJobs:
          type: array
          items: { $ref: '#/components/schemas/AuditJobSummary' }
        failedAuditJobs:
          type: array
          items: { $ref: '#/components/schemas/AuditJobSummary' }
        schedules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              cronSpec: { type: string }
              enabled: { type: boolean }
              lastRun: { type: integer, format: int64 }
        latestScanSummary: { $ref: '#/components/schemas/ScanSummary' }
        fleetStats:
          type: object
          properties:
            total: { type: integer }
            running: { type: integer }
            stopped: { type: integer }
        fleetContainers:
          type: array
          items: { $ref: '#/components/schemas/ContainerSummary' }
        fleetImages:
          type: array
          items: { $ref: '#/components/schemas/ImageSummary' }
        targetContainer: { $ref: '#/components/schemas/ContainerSummary' }
        targetContainerLogs: { $ref: '#/components/schemas/ContainerLogs' }
    ScanRunRequest:
      type: object
      required: [target]
      properties:
        target: { type: string }
    MalwareScanRequest:
      type: object
      required: [target]
      properties:
        target: { type: string }
    ScanStartResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string }
    ScanJobStatus:
      type: object
      required: [jobId, target, status, source, startedAt]
      properties:
        jobId: { type: string }
        target: { type: string }
        status: { type: string }
        source: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string }
        startedAt: { type: integer, format: int64 }
        completedAt: { type: integer, format: int64 }
    ScanSummary:
      type: object
      required: [target, source, scannedAt, critical, high, medium, low, unknown, total, riskScore]
      properties:
        target: { type: string }
        source: { type: string }
        scannedAt: { type: integer, format: int64 }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }
        total: { type: integer }
        riskScore: { type: integer }
    MalwareScanSummary:
      type: object
      required: [target, source, scannedAt, infected, threatsFound]
      properties:
        target: { type: string }
        source: { type: string }
        scannedAt: { type: integer, format: int64 }
        infected: { type: boolean }
        threatsFound: { type: array, items: { type: string } }
    MalwareThreatDetail:
      type: object
      properties:
        path: { type: string }
        signature: { type: string }
    MalwareScanDetail:
      type: object
      required: [target, source, scannedAt, infected, threatsFound]
      properties:
        target: { type: string }
        source: { type: string }
        scannedAt: { type: integer, format: int64 }
        infected: { type: boolean }
        threatsFound: { type: array, items: { type: string } }
        threatDetails:
          type: array
          items: { $ref: '#/components/schemas/MalwareThreatDetail' }
        rawOutput: { type: string }
        parseError: { type: string }
    ClamAVSignatureStatus:
      type: object
      properties:
        engineVersion: { type: string }
        databaseVersion: { type: string }
        databaseTimestamp: { type: string }
        databasePublished: { type: integer, format: int64 }
        databaseDir: { type: string }
        databaseFiles:
          type: array
          items: { type: string }
        lastLocalUpdate: { type: integer, format: int64 }
    ReleaseExcerpt:
      type: object
      required: [tag, text, weight]
      properties:
        tag: { type: string }
