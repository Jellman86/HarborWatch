name: HarborWatch
#-----------------------------------------------
# HarborWatch - Production Environment
#
# Uses GHCR 'latest' image built from release tags.
#-----------------------------------------------
services:
  harborwatch:
    image: ghcr.io/jellman86/harborwatch:latest
    container_name: harborwatch
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - harborwatch_network
    depends_on:
      - clamav
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${HARBORWATCH_PORT:-18080}:8000"
    environment:
      - TZ=${TZ:-UTC}
      - HARBORWATCH_DB_PATH=/data/harborwatch.db
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  clamav:
    image: clamav/clamav:latest
    container_name: harborwatch-clamav
    restart: unless-stopped
    networks:
      - harborwatch_network
    volumes:
      - ./clamav-db:/var/lib/clamav

networks:
  harborwatch_network:
    name: ${DOCKER_NETWORK:-harborwatch_default}
    external: true
