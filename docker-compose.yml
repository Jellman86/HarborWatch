name: HarborWatch
#-----------------------------------------------
# HarborWatch - Single-Container Runtime
#
# Uses GHCR 'latest' image for production use.
#-----------------------------------------------
services:
  harborwatch:
    image: ghcr.io/jellman86/harborwatch:latest
    container_name: harborwatch
    restart: unless-stopped
    user: "0:0"
    networks:
      - harborwatch_network
    volumes:
      - ${HW_DATA_PATH:-./data}:/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${HW_CLAMAV_DB_PATH:-./clamav-db}:/var/lib/clamav
    ports:
      - "${HARBORWATCH_PORT:-18080}:8000"
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HARBORWATCH_DB_PATH=/data/harborwatch.db
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  harborwatch_network:
    name: ${DOCKER_NETWORK:-harborwatch_default}
    external: true
